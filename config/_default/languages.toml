# -- Languages --
# English is the default and lives at the site root; Portuguese (Brazil) lives under /pt/.
# A page is translated by adding a sibling file with the language code: about.pt.md, index.pt.md.

[en]
  languageName = "English"
  languageCode = "en"
  weight = 1

[pt]
  languageName = "Português"
  languageCode = "pt-BR"
  weight = 2
  [pt.params]
    tagline = "Cloud e IA, na prática"
    headerTag = "na prática"
    description = "Notas e projetos de um arquiteto de nuvem: o que a documentação dizia, o que a produção fez e o que eu faria da próxima vez."
    [pt.params.author]
      headline = "Arquiteto de nuvem"
      bio = "Arquiteto de nuvem trabalhando com plataformas AWS, governança e soluções agênticas. Nas horas vagas, sempre testando alguma coisa de IA."
