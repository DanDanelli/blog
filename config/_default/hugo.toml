# -- Site configuration --
theme = "fieldnotes"
baseURL = "https://DanDanelli.github.io/blog/"
languageCode = "en"
defaultContentLanguage = "en"
title = "Daniel M. Danelli"

enableRobotsTXT = true
summaryLength = 40
enableEmoji = true
buildDrafts = false
buildFuture = false

[pagination]
  pagerSize = 50

[taxonomies]
  tag = "tags"
  category = "categories"
  series = "series"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

[related]
  threshold = 50
  includeNewer = true
  toLower = true
  [[related.indices]]
    name = "series"
    weight = 100
  [[related.indices]]
    name = "tags"
    weight = 80
  [[related.indices]]
    name = "date"
    weight = 10
