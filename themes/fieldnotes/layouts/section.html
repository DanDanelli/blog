{{ define "main" }}
<section class="page-head grid-paper">
  <div class="wrap">
    <h1 class="page-title">{{ .Title }}</h1>
    {{- with .Content }}<div class="page-intro">{{ . }}</div>{{ end }}
  </div>
</section>
<section class="wrap list-body narrow">
  {{ partial "note-list.html" (dict "pages" (partial "localized.html" (dict "section" .Section)) "filters" true) }}
</section>
{{ end }}
