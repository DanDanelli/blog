<footer class="site-footer">
  <div class="wrap footer-inner">
    <div class="footer-about">
      <p class="footer-name">{{ site.Params.author.name }}</p>
      <p class="muted">{{ site.Params.tagline }}. {{ i18n "writtenInPublic" }}</p>
    </div>
    {{ partial "social.html" (dict "class" "footer-links") }}
    <p class="footer-meta muted">
      © {{ now.Year }} {{ site.Params.author.name }}. {{ i18n "builtWith" }}
    </p>
  </div>
</footer>
