[project]
name = "rest-mcp-proxy"
version = "0.1.0"
description = "A declarative MCP server over a generic REST dispatcher"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["PyYAML>=6"]

[project.scripts]
rest-mcp-proxy = "rest_mcp_proxy.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
