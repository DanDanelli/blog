name: sanitization

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  denylist:
    name: denylist guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git grep needs the working tree; full history is harmless
      - name: Run sanitization check
        run: ./scripts/check-sanitization.sh

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
