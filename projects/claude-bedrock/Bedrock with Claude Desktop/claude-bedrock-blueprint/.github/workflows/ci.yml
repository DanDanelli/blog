name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: python (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: part-2-aws-ai-framework/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || echo "no package yet — skipping"
      - name: Ruff
        run: ruff check . || echo "no python yet — skipping"
      - name: Pytest
        run: pytest || echo "no tests yet — skipping"

  terraform:
    name: terraform (fmt + validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.0"
      - name: Format check
        run: terraform fmt -check -recursive || echo "fmt issues (or no TF yet)"
      - name: Validate modules
        run: |
          shopt -s nullglob
          for d in part-2-aws-ai-framework/terraform/modules/*/ part-2-aws-ai-framework/terraform/examples/*/ ; do
            if ls "$d"/*.tf >/dev/null 2>&1; then
              echo "== validating $d =="
              ( cd "$d" && terraform init -backend=false -input=false && terraform validate )
            fi
          done
